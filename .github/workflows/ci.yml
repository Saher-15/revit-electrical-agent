name: CI
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: mcp-server/server/package-lock.json }
      - run: npm ci
        working-directory: mcp-server/server
      - run: npm test
        working-directory: mcp-server/server
  revit-api:
    runs-on: ubuntu-latest
    strategy:
      matrix: { revit: [2025, 2026] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet build mcp-server/tests/compile-check -c Release -p:RevitVersion=${{ matrix.revit }}
      - run: dotnet test mcp-server/tests/production
